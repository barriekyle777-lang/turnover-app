<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Turnover</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div>
    <div class="eyebrow">MY SALES</div>
    <h1>Turnover</h1>
  </div>

  <button id="settingsBtn" class="icon-btn">⚙️</button>
</header>

<main class="container">

  <section class="hero card">

    <div class="hero-row">
      <div>
        <span class="muted">This month</span>
        <div id="monthName" class="month"></div>
      </div>

      <div class="target-pill">
        Target <strong id="targetLabel">R1 200 000</strong>
      </div>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div class="hero-stats">

      <div>
        <span>Turnover</span>
        <strong id="turnover">R0</strong>
      </div>

      <div>
        <span>Commission</span>
        <strong id="commission">R0</strong>
      </div>

      <div>
        <span>Remaining</span>
        <strong id="remaining">R1 200 000</strong>
      </div>

    </div>

  </section>

  <section class="grid">

    <div class="stat card">
      <span>Today</span>
      <strong id="todaySales">R0</strong>
      <small id="todayCount">0 sales</small>
    </div>

    <div class="stat card">
      <span>Daily target</span>
      <strong id="dailyTarget">R0</strong>
      <small id="daysLeft">0 workdays left</small>
    </div>

  </section>

  <button id="addSaleBtn" class="primary">
    ＋ Add Sale
  </button>

  <section class="card section">

    <div class="section-head">
      <h2>Recent sales</h2>
      <button id="clearBtn" class="text-btn">Clear</button>
    </div>

    <div id="salesList" class="sales-list"></div>

  </section>

</main>

<dialog id="saleDialog">

  <form id="saleForm" class="dialog-card">

    <div class="section-head">
      <h2>Add Sale</h2>
      <button type="button" class="icon-btn" id="closeSale">✕</button>
    </div>

    <label>
      Date
      <input id="saleDate" type="date" required>
    </label>

    <label>
      Customer / description
      <input id="customer" type="text" placeholder="Customer name" required>
    </label>

    <label>
      Sale amount (R)
      <input id="amount" type="number" min="0" step="0.01" required>
    </label>

    <label>
      Notes
      <textarea id="notes" rows="3"></textarea>
    </label>

    <button class="primary" type="submit">
      Save Sale
    </button>

  </form>

</dialog>

<dialog id="settingsDialog">

  <form id="settingsForm" class="dialog-card">

    <div class="section-head">
      <h2>Settings</h2>
      <button type="button" class="icon-btn" id="closeSettings">✕</button>
    </div>

    <label>
      Monthly target (R)
      <input id="targetInput" type="number" min="0">
    </label>

    <label>
      Commission rate (%)
      <input id="rateInput" type="number" min="0" step="0.01">
    </label>

    <label>
      Workdays per week
      <input id="workdaysInput" type="number" min="1" max="7">
    </label>

    <button class="primary" type="submit">
      Save Settings
    </button>

  </form>

</dialog>

<script src="app.js"></script>

</body>
</html>
